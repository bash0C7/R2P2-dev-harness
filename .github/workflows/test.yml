# ホスト層のテスト。実機は回せないので、ここが green でも完了ではない
# (完了の線引きは docs/spec.md §5)。
#
# 安くはない: picoruby と submodule の取得に加え、host build が gembox 経由で
# picoruby-mbedtls を引くので pico-sdk の mbedtls submodule まで降りてくる。
# 数百 MB と数分を見込む。
name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Fetch picoruby
        run: rake setup

      - name: Run the harness gems' picotest and compile the examples
        run: rake test

      # FPGA の Ruby 道具のうち、picoruby が要るもの (ops.h との一致、picoruby host VM との突き合わせ、
      # fpga/corpus の生成物が mrbc と一致するか) はここでだけ skip されずに回る
      - name: Check the FPGA tools against picoruby
        run: rake test:fpga

  # FPGA の HDL シミュレーション (docs/spec.md §10)。picoruby は要らないので host とは独立。
  fpga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Verilator and Icarus Verilog
        run: rake fpga:setup

      - name: Run the FPGA testbenches
        run: rake fpga:test
